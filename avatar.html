<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar - Roblox</title>
    <style>
        :root {
            --rbx-bg: #232527;
            --rbx-header-bg: #191b1d;
            --rbx-card-bg: #393b3d;
            --rbx-accent-blue: #0074BD;
            --rbx-btn-green: #00A200;
            --rbx-text-main: #FFFFFF;
            --rbx-text-sec: #B8B8B8;
            --rbx-border: #121314;
        }

        body {
            font-family: "H股", "Gotham", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--rbx-bg);
            color: var(--rbx-text-main);
            margin: 0; padding: 0;
            font-size: 14px;
        }

        header.rbx-header {
            background-color: var(--rbx-header-bg);
            height: 40px; display: flex; align-items: center;
            padding: 0 16px; border-bottom: 1px solid var(--rbx-border);
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
        }
        .rbx-logo {
            font-weight: 900; font-size: 19px; color: #fff; letter-spacing: -1px;
            margin-right: 25px; display: flex; align-items: center; gap: 4px;
        }
        .rbx-logo span {
            background: #fff; color: #191b1d; padding: 0 4px; border-radius: 3px;
            transform: rotate(-8deg); display: inline-block; font-size: 16px;
        }

        .container { max-width: 1040px; margin: 55px auto 40px auto; padding: 0 15px; }
        h1.rbx-title { font-size: 26px; font-weight: 700; margin: 0 0 15px 0; }

        .avatar-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }

        .preview-panel {
            background: var(--rbx-header-bg); border-radius: 4px; padding: 15px;
            border: 1px solid var(--rbx-border); text-align: center;
        }

        /* 2019 Roblox Avatar Viewport */
        .viewport {
            background-color: #2e3033;
            background-image: radial-gradient(circle, #3a3d40 10%, transparent 11%), radial-gradient(circle, #3a3d40 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            height: 340px; width: 100%; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px; overflow: hidden; border: 1px solid #111;
            position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .viewport img.avatar-render {
            height: 90%; width: auto; object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6));
            transition: all 0.2s ease-in-out;
        }

        .btn {
            border: none; padding: 9px 12px; border-radius: 4px; font-weight: bold;
            cursor: pointer; font-size: 13px; width: 100%; margin-bottom: 8px; transition: 0.1s;
        }
        .btn-blue { background: var(--rbx-accent-blue); color: #fff; }
        .btn-blue:hover { background: #0084d6; }

        .category-tabs { display: flex; border-bottom: 2px solid var(--rbx-border); margin-bottom: 15px; gap: 5px; }
        .tab-btn {
            padding: 8px 14px; color: var(--rbx-text-sec); background: none; border: none;
            cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; font-size: 14px;
        }
        .tab-btn.active { color: #fff; border-bottom-color: #fff; }

        .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .card {
            background-color: var(--rbx-card-bg); border-radius: 4px;
            overflow: hidden; border: 1px solid var(--rbx-border);
            position: relative; cursor: pointer; text-align: center; padding: 6px;
        }
        .card:hover { border-color: #fff; }
        .card.equipped { border: 2px solid var(--rbx-accent-blue); }
        .equipped-badge {
            display: none; position: absolute; top: 4px; right: 4px;
            background: var(--rbx-accent-blue); color: #fff; border-radius: 50%;
            width: 18px; height: 18px; text-align: center; font-size: 11px; font-weight: bold; line-height: 18px;
        }
        .card.equipped .equipped-badge { display: block; }
        
        .card-img {
            background: #252729; height: 95px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
        }
        .card-img img { max-height: 85px; max-width: 85px; }
        .card-body { padding: 6px 0 2px 0; }
        .card-title { font-size: 11px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .skin-palette { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .skin-color {
            width: 26px; height: 26px; border-radius: 3px; cursor: pointer; border: 2px solid #111;
        }
        .skin-color.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--rbx-accent-blue); }
    </style>
</head>
<body>

<header class="rbx-header">
    <div class="rbx-logo"><span>O</span>ROBLOX</div>
</header>

<div class="container">
    <h1 class="rbx-title">Avatar Editor</h1>

    <div class="avatar-layout">
        <!-- LEFT: PREVIEW -->
        <div class="preview-panel">
            <div class="viewport">
                <img id="avatar-display" class="avatar-render" src="https://tr.rbxcdn.com/30DAY-Avatar-D8829C4410FE53E261FF68752DAEE18C-Png/352/352/Avatar/Png/noFilter" alt="Roblox Avatar">
            </div>

            <p style="margin: 5px 0 10px 0; color: var(--rbx-text-sec);">Rig Type: <strong id="rig-label" style="color:#fff;">R15</strong></p>
            <button class="btn btn-blue" onclick="toggleRig()">Switch Rig (R6 / R15)</button>
        </div>

        <!-- RIGHT: INVENTORY -->
        <div>
            <h4 style="margin: 0 0 8px 0; color: var(--rbx-text-sec);">Skin Tone</h4>
            <div class="skin-palette" id="skin-container"></div>

            <div class="category-tabs">
                <button class="tab-btn active">Recent Accessories</button>
            </div>

            <div class="grid-4" id="inventory-grid"></div>
        </div>
    </div>
</div>

<script>
    // Authentic 2019 Roblox Avatar Thumbnail renders
    const avatarPresets = {
        default: "https://tr.rbxcdn.com/30DAY-Avatar-D8829C4410FE53E261FF68752DAEE18C-Png/352/352/Avatar/Png/noFilter",
        crown: "https://tr.rbxcdn.com/30DAY-Avatar-01DB13EFE893815D830C2E4C4B6ED478-Png/352/352/Avatar/Png/noFilter",
        hair: "https://tr.rbxcdn.com/30DAY-Avatar-6A582236E08DC37C75D76C44B13C6D2D-Png/352/352/Avatar/Png/noFilter",
        combo: "https://tr.rbxcdn.com/30DAY-Avatar-B7477D825CD8EE0A56AA7366BB023D78-Png/352/352/Avatar/Png/noFilter"
    };

    const state = {
        rig: "R15",
        skinColor: "#f5ca9e",
        equippedIds: [1028811]
    };

    const skinTones = ["#f5ca9e", "#eab892", "#cc8e69", "#7c4c24", "#e5e1e6", "#00A200", "#111111"];

    const items = [
        { id: 1028811, name: "Domino Crown", img: "https://tr.rbxcdn.com/30DAY-Asset-1028811-Png/150/150/AvatarAccent/Png/noFilter" },
        { id: 1374523, name: "True Blue Hair", img: "https://tr.rbxcdn.com/30DAY-Asset-1374523-Png/150/150/AvatarAccent/Png/noFilter" },
        { id: 144076358, name: "Valkyrie Helm", img: "https://tr.rbxcdn.com/30DAY-Asset-144076358-Png/150/150/AvatarAccent/Png/noFilter" },
        { id: 1125510, name: "Fiery Horns", img: "https://tr.rbxcdn.com/30DAY-Asset-1125510-Png/150/150/AvatarAccent/Png/noFilter" },
        { id: 398672920, name: "Roblox Cap", img: "https://tr.rbxcdn.com/30DAY-Asset-398672920-Png/150/150/AvatarAccent/Png/noFilter" }
    ];

    function updateAvatarRender() {
        const img = document.getElementById('avatar-display');
        const hasCrown = state.equippedIds.includes(1028811);
        const hasHair = state.equippedIds.includes(1374523);

        if (hasCrown && hasHair) {
            img.src = avatarPresets.combo;
        } else if (hasCrown) {
            img.src = avatarPresets.crown;
        } else if (hasHair) {
            img.src = avatarPresets.hair;
        } else {
            img.src = avatarPresets.default;
        }
    }

    function renderSkins() {
        const container = document.getElementById('skin-container');
        container.innerHTML = "";
        skinTones.forEach(hex => {
            const div = document.createElement('div');
            div.className = `skin-color ${state.skinColor === hex ? 'selected' : ''}`;
            div.style.backgroundColor = hex;
            div.onclick = () => { state.skinColor = hex; renderSkins(); };
            container.appendChild(div);
        });
    }

    function renderInventory() {
        const grid = document.getElementById('inventory-grid');
        grid.innerHTML = "";
        items.forEach(item => {
            const isEquipped = state.equippedIds.includes(item.id);
            const card = document.createElement('div');
            card.className = `card ${isEquipped ? 'equipped' : ''}`;
            card.onclick = () => toggleEquip(item.id);
            card.innerHTML = `
                <div class="equipped-badge">&#10003;</div>
                <div class="card-img"><img src="${item.img}" alt="${item.name}"></div>
                <div class="card-body"><div class="card-title">${item.name}</div></div>
            `;
            grid.appendChild(card);
        });
    }

    function toggleEquip(id) {
        if (state.equippedIds.includes(id)) {
            state.equippedIds = state.equippedIds.filter(i => i !== id);
        } else {
            state.equippedIds.push(id);
        }
        renderInventory();
        updateAvatarRender();
    }

    function toggleRig() {
        state.rig = state.rig === "R15" ? "R6" : "R15";
        document.getElementById('rig-label').innerText = state.rig;
    }

    renderSkins();
    renderInventory();
    updateAvatarRender();
</script>
</body>
</html>
